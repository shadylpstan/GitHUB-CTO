name: GitHub CTO

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Issue number to work on
        required: true
        type: string

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: github-cto-${{ github.event.issue.number || inputs.issue_number }}
  cancel-in-progress: false

jobs:
  codex-issue-manager:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' && github.event.label.name == 'codex') ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@codex fix'))
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_CTO_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate agent scripts
        working-directory: No-Python
        run: npm run check

      - name: Run GitHub CTO
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-4.1-mini' }}
          GITHUB_TOKEN: ${{ secrets.GH_CTO_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          GH_CTO_ISSUE_NUMBER: ${{ inputs.issue_number || github.event.issue.number }}
          GH_CTO_TEST_COMMAND: ${{ vars.GH_CTO_TEST_COMMAND }}
          GH_CTO_MAX_FILES: ${{ vars.GH_CTO_MAX_FILES || '8' }}
          GH_CTO_MAX_FILE_BYTES: ${{ vars.GH_CTO_MAX_FILE_BYTES || '80000' }}
        run: node No-Python/src/runIssue.js
